[project]
name = "generative-mnist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alessandro Caruso", email = "research@acaruso.net" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
